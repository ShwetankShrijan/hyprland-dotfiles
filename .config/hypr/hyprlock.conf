general {
    hide_cursor = true
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 400, 65
    outline_thickness = 2

    outer_color = rgb(233, 236, 239)
    inner_color = rgb(16, 16, 16)
    font_color = rgb(233, 236, 239)

    fade_on_empty = false
    rounding = 0 

    placeholder_text = <i></i>

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    position = 0, 0
    halign = center 
    valign = center
}
