# ╭──────────────────────────────────────────────╮
# │                  GENERAL                     │
# ╰──────────────────────────────────────────────╯

unbind C-b 
set -g prefix C-s 
bind C-s send-prefix


set -g mouse on
set -g default-terminal "tmux-256color"

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on
setw -g automatic-rename off


# ╭──────────────────────────────────────────────╮
# │                 STATUS BAR                   │
# ╰──────────────────────────────────────────────╯

set -g status on
set -g status-position bottom
set -g status-interval 1

set -g status-left-length 40
set -g status-right-length 100


# ────────────────────────────────────────────────
# LEFT
# ────────────────────────────────────────────────

set -g status-left "#[fg=#E9ECEF]  ○ #[fg=#F8F9FA,bold]#S #[fg=#495057]│"


# ────────────────────────────────────────────────
# WINDOWS
# ────────────────────────────────────────────────

setw -g window-status-format \
"#[fg=#6C757D]  #I:#W  "

setw -g window-status-current-format \
"#[fg=#101010,bg=#E9ECEF,bold]  #I:#W  "


# ────────────────────────────────────────────────
# RIGHT
# ────────────────────────────────────────────────

set -g status-right \
"#[fg=#E9ECEF] 󰉋 #[fg=#F8F9FA]#{pane_current_path} #[fg=#495057]│ #[fg=#ADB5BD]󰊢"


# ────────────────────────────────────────────────
# COLORS
# ────────────────────────────────────────────────

set -g status-style "bg=#101010"

set -g message-style \
"bg=#343A40,fg=#E9ECEF"

set -g message-command-style \
"bg=#343A40,fg=#E9ECEF"


# ────────────────────────────────────────────────
# PANES
# ────────────────────────────────────────────────

set -g pane-border-style "fg=#343A40"
set -g pane-active-border-style "fg=#ADB5BD"


# ────────────────────────────────────────────────
# RELOAD
# ────────────────────────────────────────────────

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
